name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and attach as a draft release
        required: true
        type: string

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: envoy-web-bot-auth-release
          node_image: kindest/node:v1.35.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
      - uses: anchore/sbom-action/download-syft@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes skopeo jq
      - run: cargo install cargo-deny --version 0.18.3 --locked
      - name: Check tag version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "envoy-web-bot-auth-module") | .version')"
      - name: Run the release commit's Kind suite
        env:
          CLUSTER_NAME: envoy-web-bot-auth-release
        run: make kind-test
      - run: make release-verify
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: ignore
      - if: always()
        run: make kind-down CLUSTER_NAME=envoy-web-bot-auth-release

  draft:
    name: draft-release
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --draft --title "$RELEASE_TAG" --generate-notes
