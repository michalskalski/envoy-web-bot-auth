apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: web-bot-auth-composition-quota
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-bot-auth-composition-quota
  rateLimit:
    local:
      rules:
        - limit:
            requests: 2
            unit: Minute
