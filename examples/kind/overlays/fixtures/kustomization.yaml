# The fixture resolver is compiled with the non-default `kind-fixtures`
# feature. Never use this overlay outside deterministic integration tests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../resources.yaml
patches:
  - target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyProxy
      name: web-bot-auth
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyDeployment/patch/value/spec/template/spec/containers/0/image
        value: envoy-web-bot-auth-resolver-fixtures:dev
      - op: replace
        path: /spec/provider/kubernetes/envoyDeployment/patch/value/spec/template/spec/containers/0/args
        value:
          - serve-fixtures
          - --listen=unix:///run/wba/resolver.sock
          - --allow-test-keys
