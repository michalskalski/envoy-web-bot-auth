apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bot-auth-resolver
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-bot-auth-resolver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-bot-auth-resolver
        app.kubernetes.io/part-of: envoy-web-bot-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resolver
          image: envoy-web-bot-auth-resolver:dev
          imagePullPolicy: Never
          args:
            - serve
            - --listen=tcp://0.0.0.0:8081
            - --egress-mode=direct
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-bot-auth-resolver
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: web-bot-auth-resolver
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-bot-auth-resolver
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-bot-auth-resolver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8081
