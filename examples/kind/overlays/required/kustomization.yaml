apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../fixtures
patches:
  - target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyExtensionPolicy
      name: web-bot-auth
    patch: |-
      - op: replace
        path: /spec/dynamicModule/0/config/mode
        value: required
  - target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyProxy
      name: web-bot-auth
    patch: |-
      - op: add
        path: /spec/provider/kubernetes/envoyDeployment/patch/value/spec/template/spec/containers/0/readinessProbe
        value:
          exec:
            command:
              - /web-bot-auth-resolver
              - probe
              - --socket=/run/wba/resolver.sock
              - --timeout-ms=250
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 2
