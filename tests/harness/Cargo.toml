[package]
name = "web-bot-auth-test-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration and kind test harness for Web Bot Auth"
publish = false

[features]
kind-fixtures = []

[[bin]]
name = "wba-kind-request"
path = "tests/kind/generate-fixtures.rs"
required-features = ["kind-fixtures"]

[[test]]
name = "kind_e2e"
path = "tests/kind/e2e.rs"
required-features = ["kind-fixtures"]

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
indexmap = "2.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sfv = "0.13.0"
toml = "1.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"
web-bot-auth = "=0.7.0"
