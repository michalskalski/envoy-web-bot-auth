[package]
name = "envoy-web-bot-auth"
version = "0.1.0"
edition = "2024"

[lib]
name = "envoy_web_bot_auth"
crate-type = ["cdylib", "rlib"]

[dependencies]
envoy-proxy-dynamic-modules-rust-sdk = {
    git = "https://github.com/envoyproxy/envoy",
    rev = "8eea3285d6bdb89f8ea34632cfe7ce1608a8f374",
}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sfv = "0.13.0"
web-bot-auth = "=0.7.0"
